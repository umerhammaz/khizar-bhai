<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronos - History Archive</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo">⏳</span>
      <h1>Chronos</h1>
    </div>
    <nav class="filters" id="era-nav"></nav>
  </header>

  <main class="container">
    <section class="controls">
      <input type="search" id="search" placeholder="Search events, people, eras..." aria-label="Search">
      <div class="tag-filters" id="tag-filters"></div>
    </section>

    <section id="timeline" class="timeline" aria-live="polite"></section>
  </main>

  <dialog id="detail-dialog" class="dialog">
    <article id="dialog-content" class="dialog-body"></article>
    <button id="dialog-close" class="dialog-close" aria-label="Close">✕</button>
  </dialog>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
